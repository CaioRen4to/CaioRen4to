name: Update GitHub Stats SVGs

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/update-stats.yml"
      - "README.md"
  schedule:
    - cron: "0 6 * * *" # Atualiza todos os dias às 03:00 (BRT)
  workflow_dispatch:

# Serialize writes to main with snake.yml.
concurrency:
  group: profile-assets-main
  queue: max
  cancel-in-progress: false

jobs:
  update-stats:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Checkout profile repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Validate GH_PAT secret (Fail-Closed for private repos)
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          if [ -z "$GH_PAT" ]; then
            echo "::error::Secret GH_PAT ausente. Configure um PAT em Settings > Secrets > Actions para incluir repositórios privados (ex.: Fluire)."
            exit 1
          fi

      - name: Generate Stats Card (Dark)
        uses: stats-organization/github-readme-stats-action@2c498845f71017821efaad14293ebc736156ef21 # v2.1.0
        with:
          card: stats
          options: username=${{ github.repository_owner }}&show_icons=true&include_all_commits=true&count_private=true&bg_color=0B0F17&title_color=22D3EE&icon_color=6366F1&text_color=F1F5F9&border_color=1E293B
          path: assets/stats-dark.svg
          token: ${{ secrets.GH_PAT }}
          fail_on_error: "true"

      - name: Generate Stats Card (Light)
        uses: stats-organization/github-readme-stats-action@2c498845f71017821efaad14293ebc736156ef21 # v2.1.0
        with:
          card: stats
          options: username=${{ github.repository_owner }}&show_icons=true&include_all_commits=true&count_private=true&bg_color=F8FAFC&title_color=0E7490&icon_color=4F46E5&text_color=0F172A&border_color=CBD5E1
          path: assets/stats-light.svg
          token: ${{ secrets.GH_PAT }}
          fail_on_error: "true"

      - name: Generate Top Languages (Dark)
        uses: stats-organization/github-readme-stats-action@2c498845f71017821efaad14293ebc736156ef21 # v2.1.0
        with:
          card: top-langs
          options: username=${{ github.repository_owner }}&layout=compact&langs_count=8&bg_color=0B0F17&title_color=22D3EE&text_color=F1F5F9&border_color=1E293B
          path: assets/top-langs-dark.svg
          token: ${{ secrets.GH_PAT }}
          fail_on_error: "true"

      - name: Generate Top Languages (Light)
        uses: stats-organization/github-readme-stats-action@2c498845f71017821efaad14293ebc736156ef21 # v2.1.0
        with:
          card: top-langs
          options: username=${{ github.repository_owner }}&layout=compact&langs_count=8&bg_color=F8FAFC&title_color=0E7490&text_color=0F172A&border_color=CBD5E1
          path: assets/top-langs-light.svg
          token: ${{ secrets.GH_PAT }}
          fail_on_error: "true"

      - name: Commit and push updated stats SVGs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/stats-*.svg assets/top-langs-*.svg
          if ! git diff --staged --quiet; then
            AUTH_B64=$(printf 'x-access-token:%s' "$GITHUB_TOKEN" | base64 -w0)
            echo "::add-mask::$AUTH_B64"
            git commit -m "chore: auto-update GitHub stats SVGs [skip ci]"
            git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $AUTH_B64" pull --rebase origin main
            git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $AUTH_B64" push origin HEAD:main
          fi
